name: Verify scheduled path

# Adapted from viseshb/claude-codex-warmer (MIT).
on:
  workflow_dispatch:

concurrency:
  group: codex-window-warmer
  cancel-in-progress: false

permissions: {}

jobs:
  warm-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Restore Codex authentication
        id: restore
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON is missing."
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
          echo "auth_sha=$(sha256sum "$HOME/.codex/auth.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official Codex CLI
        run: npm install -g @openai/codex@0.144.1

      - name: Check or send
        shell: bash
        run: |
          node --input-type=module <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          import childProcess from 'node:child_process';
          import fs from 'node:fs';
          import { createInterface } from 'node:readline';
          import { homedir } from 'node:os';
          import { join } from 'node:path';
          import { setTimeout as sleep } from 'node:timers/promises';

          export async function retry(label, action, wait = sleep) {
            for (let attempt = 1; attempt <= 4; attempt++) {
              try { return await action(); }
              catch (error) {
                console.log(`${label}: attempt ${attempt}/4 failed.`);
                if (attempt === 4) throw error;
                console.log('Retrying in 30 seconds.');
                await wait(30000);
              }
            }
          }

          export async function readQuota() {
            const deadline = AbortSignal.timeout(60000);
            // Let the official CLI maintain the managed login before reading its access token.
            const child = childProcess.spawn('codex', ['app-server'], {
              stdio: ['pipe', 'pipe', 'ignore'], signal: deadline
            });
            const lines = createInterface({ input: child.stdout });
            const write = message => child.stdin.write(JSON.stringify(message) + '\n');
            try {
              await new Promise((resolve, reject) => {
                child.on('error', reject);
                child.stdin.on('error', reject);
                child.once('exit', () => reject(new Error('Login client stopped before completing.')));
                lines.on('line', line => {
                  let message;
                  try { message = JSON.parse(line); } catch { return; }
                  if (message.id !== 1 && message.id !== 2) return;
                  if (message.error) return reject(new Error('Codex login refresh failed.'));
                  if (message.id === 1) {
                    write({ method: 'initialized', params: {} });
                    write({ id: 2, method: 'account/read', params: { refreshToken: true } });
                  } else resolve();
                });
                write({ id: 1, method: 'initialize', params: {
                  clientInfo: { name: 'codex_window_warmer', version: '2.0.0' }
                } });
              });
            } finally {
              lines.close();
              child.kill('SIGKILL');
            }

            let tokens;
            try { tokens = JSON.parse(fs.readFileSync(join(homedir(), '.codex', 'auth.json'), 'utf8')).tokens; }
            catch { throw new Error('Could not read Codex authentication.'); }
            if (!tokens?.access_token || !tokens.account_id)
              throw new Error('Codex authentication is missing the account or access token.');
            const response = await fetch('https://chatgpt.com/backend-api/wham/usage', {
              signal: deadline,
              headers: {
                Authorization: `Bearer ${tokens.access_token}`,
                'chatgpt-account-id': tokens.account_id
              }
            });
            if (!response.ok) throw new Error(`Quota query failed: HTTP ${response.status}.`);
            const quota = (await response.json()).rate_limit?.primary_window;
            if (quota?.limit_window_seconds !== 18000 ||
                !Number.isFinite(quota.reset_after_seconds) || quota.reset_after_seconds < 0)
              throw new Error('The server did not return valid five-hour reset seconds.');
            return quota.reset_after_seconds;
          }

          export function sendRequest() {
            return new Promise((resolve, reject) => {
              const child = childProcess.execFile('codex', [
                'exec', '--ephemeral', '--sandbox', 'read-only', '--skip-git-repo-check',
                '-m', 'gpt-5.6-sol', '-c', 'model_reasoning_effort="low"',
                'Reply only with hi. Do not use tools or read any files.'
              ], { timeout: 120000 }, (error, stdout) => {
                if (error || child.killed)
                  return reject(new Error(child.killed ? 'Codex request timed out.' : 'Codex request failed.'));
                const reply = stdout.trim();
                if (!reply) return reject(new Error('Codex returned an empty reply.'));
                resolve(reply);
              });
              child.stdin.end();
            });
          }

          export async function main(event, { query = readQuota, send = sendRequest, wait = sleep } = {}) {
            if (event !== 'workflow_dispatch') {
              const remaining = await retry('Quota query', query, wait);
              console.log(`Seconds until five-hour reset: ${remaining}`);
              if (remaining < 17700) {
                console.log('Timer is running; skipped.');
                return;
              }
              console.log('Timer is within the five-minute margin; sending.');
            } else console.log('Manual run; sending.');

            const reply = await retry('Codex request', send, wait);
            console.log('Response: ' + reply.slice(0, 200));
            console.log('Request succeeded.');
          }
          await main('schedule');
          JS

      - name: Save authentication only if refreshed
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ORIGINAL_AUTH_SHA: ${{ steps.restore.outputs.auth_sha }}
        run: |
          current_sha=$(sha256sum "$HOME/.codex/auth.json" | cut -d ' ' -f 1)
          if [ "$current_sha" = "$ORIGINAL_AUTH_SHA" ]; then
            echo "Authentication unchanged; no secret update needed."
            exit 0
          fi
          gh secret set CODEX_AUTH_JSON --repo "${{ github.repository }}" < "$HOME/.codex/auth.json"
