name: codex-window-warmer

# Adapted from viseshb/claude-codex-warmer (MIT).
# Check every 30 minutes; send when the last successful request is >= 5 hours old.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check the five-hour timer; do not send a request"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  WARM_INTERVAL_SECONDS: "18000"
  CODEX_CLI_VERSION: "0.144.1"

concurrency:
  group: codex-window-warmer
  cancel-in-progress: false

jobs:
  warm-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check five-hour timer
        id: check
        env:
          CHECK_ONLY: ${{ inputs.check_only || false }}
          TRIGGER: ${{ github.event_name }}
        run: |
          now=$(date +%s)
          last=0
          if [ -f .state/codex-last-warm.txt ]; then
            last=$(cat .state/codex-last-warm.txt)
            case "$last" in
              (''|*[!0-9]*) echo "::error::Invalid last-send timestamp; refusing to send."; exit 1 ;;
            esac
          fi
          if [ "$last" -gt "$now" ]; then
            echo "::error::Last-send timestamp is in the future; refusing to send."
            exit 1
          fi
          elapsed=$((now - last))
          remaining=$((WARM_INTERVAL_SECONDS - elapsed))
          send=false
          if [ "$remaining" -le 0 ]; then
            remaining=0
            reason="Five hours elapsed; request is due."
            if [ "$CHECK_ONLY" = "true" ]; then
              reason="Request is due, but this is a check-only run."
            else
              send=true
            fi
          else
            reason="Waiting: ${remaining}s remain until the next request."
          fi
          echo "$reason"
          echo "send=$send" >> "$GITHUB_OUTPUT"
          {
            echo "## Connection check"
            echo "- Trigger: $TRIGGER"
            echo "- Checked at: $(TZ=Asia/Shanghai date '+%F %T %Z')"
            echo "- Schedule: every hour at :11 and :41 (GitHub may delay scheduling)."
            echo "- Minimum request interval: 18000 seconds / 5 hours."
            if [ "$last" -gt 0 ]; then
              echo "- Last successful request: $(TZ=Asia/Shanghai date -d "@$last" '+%F %T %Z')"
              echo "- Elapsed: ${elapsed}s."
            else
              echo "- Last successful request: none recorded."
            fi
            echo "- Decision: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Codex auth
        if: steps.check.outputs.send == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ] || [ -z "$GH_PAT" ]; then
            echo "::error::Configure CODEX_AUTH_JSON and GH_PAT."
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.send == 'true'
        with:
          node-version: "20"

      - name: Install Codex CLI
        if: steps.check.outputs.send == 'true'
        run: npm install -g "@openai/codex@${CODEX_CLI_VERSION}"

      - name: Send warm-up prompt
        id: warm
        if: steps.check.outputs.send == 'true'
        run: |
          reply_file=$(mktemp)
          trap 'rm -f "$reply_file"' EXIT
          for attempt in 1 2 3; do
            started=$(date +%s)
            if codex exec --ephemeral --sandbox read-only --skip-git-repo-check -m gpt-5.6-sol \
              -c model_reasoning_effort="low" "Reply only with hi. Do not use tools or read any files." > "$reply_file"; then
              cat "$reply_file"
              reply=$(tr -d '\r\n' < "$reply_file")
              if [ "$reply" = "hi" ]; then
                echo "sent_at=$started" >> "$GITHUB_OUTPUT"
                echo "- Request: succeeded; response was hi." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::warning::Request returned an unexpected response."
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "::error::All three request attempts failed."
          exit 1

      - name: Persist refreshed auth back to secret (best-effort)
        id: persist_auth
        if: ${{ always() && steps.check.outputs.send == 'true' && steps.warm.outcome != 'skipped' && env.GH_PAT != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.GH_PAT }}
        run: |
          gh secret set CODEX_AUTH_JSON --repo "${{ github.repository }}" < "$HOME/.codex/auth.json"

      - name: Record successful request time
        if: ${{ !cancelled() && steps.warm.outcome == 'success' }}
        env:
          SENT_AT: ${{ steps.warm.outputs.sent_at }}
        run: |
          case "$SENT_AT" in
            (''|*[!0-9]*) echo "::error::Missing successful request timestamp."; exit 1 ;;
          esac
          mkdir -p .state
          printf '%s\n' "$SENT_AT" > .state/codex-last-warm.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .state/codex-last-warm.txt
          git commit -m "chore: record successful connection request"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "- Successful request timestamp: saved to repository." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Could not save the successful request timestamp."
          exit 1

      - name: Report authentication persistence failure
        if: ${{ !cancelled() && steps.persist_auth.outcome == 'failure' }}
        run: |
          echo "::error::Could not save refreshed credentials; check the persistence step."
          echo "- Authentication persistence: failed; maintenance is required." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  heartbeat:
    needs: [warm-codex]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit timestamp (once per UTC day)
        run: |
          today=$(date -u +%F)
          if [ "$(cut -c1-10 heartbeat.txt 2>/dev/null)" = "$today" ]; then
            echo "Heartbeat already recorded today; skipping."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: daily heartbeat"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Could not save the daily heartbeat."
          exit 1
