name: codex-window-warmer

# Adapted from viseshb/claude-codex-warmer (MIT).
# Read real quota every 30 minutes; an upcoming reset is activated at reset + 60s.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

concurrency:
  group: codex-window-warmer
  cancel-in-progress: false

jobs:
  warm-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore Codex authentication
        id: restore
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON is missing."
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
          echo "auth_sha=$(sha256sum "$HOME/.codex/auth.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official Codex CLI
        run: npm install -g @openai/codex@0.144.1

      - name: Check quota and activate when due
        run: |
          node --input-type=module <<'JS'
          import { spawn, execFile } from 'node:child_process';
          import { createInterface } from 'node:readline';
          import { promisify } from 'node:util';
          import { setTimeout as sleep } from 'node:timers/promises';
          import { existsSync, readFileSync, mkdirSync, writeFileSync, appendFileSync } from 'node:fs';

          const exec = promisify(execFile);
          const WINDOW = 5 * 60 * 60;
          const INTERVAL = 30 * 60;
          const STATE = '.state/last-activation.json';
          const now = () => Date.now() / 1000;
          const stamp = seconds => new Date(seconds * 1000).toLocaleString('sv-SE', { timeZone: 'Asia/Shanghai' }) + ' GMT+8';

          function report(message) {
            console.log(message);
            if (process.env.GITHUB_STEP_SUMMARY)
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- ' + message + '\n');
          }

          export function parseQuota(result) {
            const limits = result.rateLimitsByLimitId ? result.rateLimitsByLimitId.codex : result.rateLimits;
            const primary = limits?.primary;
            if (primary?.windowDurationMins !== 300 || !Number.isInteger(primary.resetsAt) || primary.resetsAt <= 0 ||
                !Number.isFinite(primary.usedPercent) || primary.usedPercent < 0 || primary.usedPercent > 100)
              throw new Error('Missing valid five-hour Codex quota; refusing to guess a reset time.');
            return { resetAt: primary.resetsAt, usedPercent: primary.usedPercent };
          }

          function readQuota() {
            return new Promise((resolve, reject) => {
              const child = spawn('codex', ['app-server'], { stdio: ['pipe', 'pipe', 'ignore'] });
              const lines = createInterface({ input: child.stdout });
              let done = false;
              const timer = setTimeout(() => finish(new Error('Account quota query timed out.')), 60000);
              function finish(error, value) {
                if (done) return;
                done = true;
                clearTimeout(timer);
                lines.close();
                child.kill();
                const cleanup = setTimeout(() => child.kill('SIGKILL'), 5000);
                cleanup.unref();
                child.once('exit', () => clearTimeout(cleanup));
                error ? reject(error) : resolve(value);
              }
              const write = message => child.stdin.write(JSON.stringify(message) + '\n');
              child.on('error', finish);
              child.stdin.on('error', finish);
              child.on('exit', () => finish(new Error('Account quota client stopped.')));
              lines.on('line', line => {
                let message;
                try { message = JSON.parse(line); } catch { return; }
                if (done || (message.id !== 1 && message.id !== 2)) return;
                if (message.error) return finish(new Error('Account quota request failed.'));
                if (message.id === 1) {
                  write({ method: 'initialized', params: {} });
                  write({ id: 2, method: 'account/rateLimits/read' });
                } else {
                  try { finish(null, parseQuota(message.result)); } catch (error) { finish(error); }
                }
              });
              write({ id: 1, method: 'initialize', params: { clientInfo: { name: 'codex_quota_check', version: '1.0.0' } } });
            });
          }

          export function decide(quota, activatedAt, checkedAt) {
            const remaining = quota.resetAt - checkedAt;
            if (remaining <= 0)
              return activatedAt >= quota.resetAt
                ? { due: null, reason: 'This reset was already activated; server metadata is stale.' }
                : { due: checkedAt, reason: 'The server reset time has passed; activate now.' };
            // Compare with the current SERVER window, never with last activation + five hours.
            const alreadyActivated = activatedAt >= quota.resetAt - WINDOW;
            // A window opened during the latest check interval is fresh, even if already used elsewhere.
            const fresh = remaining >= WINDOW - INTERVAL && remaining <= WINDOW;
            if (!alreadyActivated && (activatedAt > 0 || fresh))
              return { due: checkedAt, reason: 'A new quota window is available; activate now.' };
            if (remaining <= INTERVAL)
              return { due: quota.resetAt + 60, reason: 'Reset is within 30 minutes; activate at reset plus one minute.' };
            return { due: null, reason: 'No activation is due; wait for the next scheduled check.' };
          }

          async function retry(label, action) {
            for (let attempt = 1; ; attempt++) {
              try { return await action(); }
              catch (error) {
                if (attempt === 3) throw error;
                report(label + ' failed; retrying in 10 seconds.');
                await sleep(10000);
              }
            }
          }

          async function saveActivation(completedAt) {
            mkdirSync('.state', { recursive: true });
            writeFileSync(STATE, JSON.stringify(completedAt) + '\n');
            const git = (...args) => exec('git', args, { timeout: 30000 });
            await git('config', 'user.name', 'github-actions[bot]');
            await git('config', 'user.email', 'github-actions[bot]@users.noreply.github.com');
            await git('add', STATE);
            await git('commit', '-m', 'chore: record successful activation');
            await retry('Saving activation', async () => {
              await git('pull', '--rebase');
              await git('push');
            });
          }

          export async function run(quota, activatedAt, { clock = now, wait = sleep, send, save, log = report }) {
            const checkedAt = clock();
            const { due, reason } = decide(quota, activatedAt, checkedAt);
            log('Checked at: ' + stamp(checkedAt));
            log('Five-hour quota remaining: ' + (100 - quota.usedPercent) + '%');
            log('Server reset time: ' + stamp(quota.resetAt));
            log('Decision: ' + reason);
            if (due === null) return 'skip';
            log('Request scheduled for: ' + stamp(due));
            await wait(Math.max(0, due - clock()) * 1000);
            await send();
            const completedAt = clock();
            await save(completedAt);
            log('Activation succeeded at: ' + stamp(completedAt));
            return 'sent';
          }

          export async function main() {
            const activatedAt = existsSync(STATE) ? JSON.parse(readFileSync(STATE, 'utf8')) : 0;
            if (!Number.isFinite(activatedAt) || activatedAt < 0 || activatedAt > now())
              throw new Error('Invalid successful activation record.');
            await run(await readQuota(), activatedAt, {
              save: saveActivation,
              send: async () => {
                const result = await retry('Activation request', () => exec('codex', [
                  'exec', '--ephemeral', '--sandbox', 'read-only', '--skip-git-repo-check',
                  '-m', 'gpt-5.6-sol', '-c', 'model_reasoning_effort="low"',
                  'Reply only with hi. Do not use tools or read any files.'
                ], { timeout: 120000 }));
                report('Response: ' + (result.stdout.trim().slice(0, 200) || '[empty response]'));
              }
            });
          }
          await main();
          JS

      - name: Save authentication only if refreshed
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ORIGINAL_AUTH_SHA: ${{ steps.restore.outputs.auth_sha }}
        run: |
          current_sha=$(sha256sum "$HOME/.codex/auth.json" | cut -d ' ' -f 1)
          if [ "$current_sha" = "$ORIGINAL_AUTH_SHA" ]; then
            echo "Authentication unchanged; no secret update needed."
            exit 0
          fi
          gh secret set CODEX_AUTH_JSON --repo "${{ github.repository }}" < "$HOME/.codex/auth.json"
