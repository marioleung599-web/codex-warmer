name: codex-window-warmer

# Adapted from viseshb/claude-codex-warmer (MIT).
# Check real quota every 30 minutes; when reset is near, wait until reset + 60s.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

concurrency:
  group: codex-window-warmer
  cancel-in-progress: false

jobs:
  warm-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Codex auth
        id: restore
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ] || [ -z "$GH_PAT" ]; then
            echo "::error::Configure CODEX_AUTH_JSON and GH_PAT."
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
          echo "auth_sha=$(sha256sum "$HOME/.codex/auth.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official Codex CLI
        run: npm install -g @openai/codex@0.144.1

      - name: Check real quota and activate after reset
        run: |
          python - <<'PY'
          """Check the real quota; wait only when its reset is within one check interval."""
          import json
          import os
          from pathlib import Path
          import queue
          import subprocess
          import threading
          import time


          class LimitsClient:
              def __init__(self):
                  self.proc = subprocess.Popen(['codex', 'app-server'], stdin=subprocess.PIPE,
                                               stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                               text=True, bufsize=1)
                  self.responses = queue.Queue()
                  self.sequence = 0
                  def read():
                      for line in self.proc.stdout:
                          try:
                              message = json.loads(line)
                          except ValueError:
                              continue
                          if 'id' in message:
                              self.responses.put(message)
                      self.responses.put(None)
                  threading.Thread(target=read, daemon=True).start()

              def rpc(self, method, params=None):
                  self.sequence += 1
                  message = {'id': self.sequence, 'method': method}
                  if params is not None:
                      message['params'] = params
                  self.proc.stdin.write(json.dumps(message) + '\n')
                  self.proc.stdin.flush()
                  until = time.monotonic() + 60
                  while True:
                      remaining = until - time.monotonic()
                      if remaining <= 0:
                          raise RuntimeError('Account quota query timed out')
                      try:
                          response = self.responses.get(timeout=remaining)
                      except queue.Empty:
                          raise RuntimeError('Account quota query timed out') from None
                      if response is None:
                          raise RuntimeError('Account quota client stopped')
                      if response.get('id') != self.sequence:
                          continue
                      if 'error' in response:
                          raise RuntimeError('Account quota query failed: ' + method)
                      return response['result']

              def read(self):
                  self.rpc('initialize', {'clientInfo': {'name': 'codex_quota_check', 'version': '1.0.0'}})
                  self.proc.stdin.write(json.dumps({'method': 'initialized', 'params': {}}) + '\n')
                  self.proc.stdin.flush()
                  result = self.rpc('account/rateLimits/read')
                  buckets = result.get('rateLimitsByLimitId')
                  limits = buckets.get('codex', {}) if buckets else result.get('rateLimits', {})
                  primary = (limits or {}).get('primary') or {}
                  if primary.get('windowDurationMins') != 300:
                      raise RuntimeError('The server did not return a five-hour Codex quota')
                  reset, used = primary.get('resetsAt'), primary.get('usedPercent')
                  if isinstance(reset, bool) or not isinstance(reset, (int, float)) or reset <= 0:
                      raise RuntimeError('Missing valid server reset time; no fallback request will be sent')
                  if isinstance(used, bool) or not isinstance(used, (int, float)) or not 0 <= used <= 100:
                      raise RuntimeError('Missing valid quota percentage')
                  return {'resetAt': int(reset), 'usedPercent': used}

              def close(self):
                  if self.proc.poll() is None:
                      self.proc.terminate()
                  try:
                      self.proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      self.proc.kill()
                      self.proc.wait()


          def read_limits():
              client = LimitsClient()
              try:
                  return client.read()
              finally:
                  client.close()


          def stamp(value):
              from datetime import datetime, timezone, timedelta
              return datetime.fromtimestamp(value, timezone(timedelta(hours=8))).strftime('%F %T GMT+8')


          def report(message):
              print(message, flush=True)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as handle:
                      handle.write('- ' + message + '\n')


          def decide(limits, state, now, interval):
              reset = limits['resetAt']
              remaining = reset - now
              observed = state.get('observedResetAt', 0)
              handled = state.get('handledResetAt', 0)
              activated = state.get('activatedWindowResetAt', 0)
              if reset <= now:
                  if reset <= handled:
                      return None, 'This reset was already handled; server metadata has not advanced.'
                  return now, 'The server reset time has passed; send now.'
              if handled < observed <= now:
                  return now, 'The previously observed server reset has passed and a new window is reported; send now.'
              # A tiny request may round to 0% used. Remember the activated window so a
              # manual rerun cannot activate that same full-looking window again.
              if limits['usedPercent'] == 0 and abs(remaining - 18000) <= 120:
                  if reset == activated:
                      return None, 'This quota window was already activated.'
                  return now, 'Quota is 100% available and the next reset is about five hours away; send now.'
              if remaining <= interval:
                  return reset + 60, 'Reset is within one check interval; wait until reset plus one minute.'
              return None, 'Reset is more than one check interval away; finish and wait for the next scheduled check.'


          def check(limits, state, save, send, now=time.time, sleep=time.sleep,
                    interval=1800, read_after=read_limits, emit=report):
              checked_at = now()
              due, reason = decide(limits, state, checked_at, interval)
              emit('Checked at: ' + stamp(checked_at))
              emit('Five-hour quota remaining: ' + str(100 - limits['usedPercent']) + '%')
              emit('Server reset time: ' + stamp(limits['resetAt']))
              emit('Seconds until reset: ' + str(round(limits['resetAt'] - checked_at)))
              emit('Decision: ' + reason)
              if due is not None:
                  emit('Request scheduled for: ' + stamp(due))
              previous_reset = state.get('observedResetAt', 0)
              state['observedResetAt'] = limits['resetAt']
              if due is None:
                  if previous_reset != limits['resetAt']:
                      save()
                  return 'skip'
              # One short-lived run sleeps at most one interval plus 60 seconds. It does
              # not dispatch another workflow or keep a five-hour resident process.
              while True:
                  remaining = due - now()
                  if remaining <= 0:
                      break
                  sleep(remaining)
              emit('Starting the activation request at ' + stamp(now()))
              sent_at = send()
              if limits['resetAt'] <= sent_at:
                  state['handledResetAt'] = limits['resetAt']
              elif previous_reset and previous_reset <= sent_at:
                  state['handledResetAt'] = max(state.get('handledResetAt', 0), previous_reset)
              state['activatedWindowResetAt'] = limits['resetAt']
              emit('Activation request succeeded.')
              try:
                  updated = read_after()
                  state['observedResetAt'] = updated['resetAt']
                  state['activatedWindowResetAt'] = updated['resetAt']
                  emit('Next server reset time: ' + stamp(updated['resetAt']))
              finally:
                  # Save once, including the successful activation if the follow-up query fails.
                  save()
              return 'sent'


          def request_hi():
              for attempt in range(3):
                  started = time.time()
                  try:
                      result = subprocess.run(['codex', 'exec', '--ephemeral', '--sandbox', 'read-only',
                          '--skip-git-repo-check', '-m', 'gpt-5.6-sol', '-c', 'model_reasoning_effort="low"',
                          'Reply only with hi. Do not use tools or read any files.'],
                          stdout=subprocess.PIPE, text=True, timeout=120)
                  except subprocess.TimeoutExpired:
                      result = None
                  if result is not None and result.returncode == 0:
                      report('Response: ' + (result.stdout.strip()[:200] or '[empty response]'))
                      return started
                  if attempt < 2:
                      report('Request failed; retrying in 10 seconds.')
                      time.sleep(10)
              raise RuntimeError('All three activation request attempts failed')


          def main():
              path = Path('.state/codex-quota-check.json')
              state = json.loads(path.read_text()) if path.exists() else {}
              for key in ('observedResetAt', 'handledResetAt', 'activatedWindowResetAt'):
                  value = state.get(key, 0)
                  if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                      raise RuntimeError('Invalid saved quota state')
              def save():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
                  subprocess.run(['git', 'add', str(path)], check=True)
                  changed = subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode
                  if changed == 0:
                      return
                  if changed != 1:
                      raise RuntimeError('Could not inspect quota state')
                  subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
                  subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], check=True)
                  subprocess.run(['git', 'commit', '-m', 'chore: record quota check state'], check=True)
                  for attempt in range(3):
                      if subprocess.run(['git', 'pull', '--rebase', '--autostash']).returncode == 0:
                          if subprocess.run(['git', 'push']).returncode == 0:
                              return
                      if attempt < 2:
                          time.sleep(3)
                  raise RuntimeError('Could not persist quota state')
              check(read_limits(), state, save, request_hi)


          if __name__ == '__main__':
              main()
          PY

      - name: Persist refreshed authentication
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ env.GH_PAT }}
          ORIGINAL_AUTH_SHA: ${{ steps.restore.outputs.auth_sha }}
        run: |
          current_sha=$(sha256sum "$HOME/.codex/auth.json" | cut -d ' ' -f 1)
          if [ "$current_sha" = "$ORIGINAL_AUTH_SHA" ]; then
            echo "Authentication unchanged; no secret update needed."
            exit 0
          fi
          gh secret set CODEX_AUTH_JSON --repo "${{ github.repository }}" < "$HOME/.codex/auth.json"
